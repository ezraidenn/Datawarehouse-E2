services:
  db:
    image: postgis/postgis:17-3.5
    container_name: merida_dw
    environment:
      POSTGRES_DB: ${PGDATABASE:-merida_dw}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - merida_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  merida_dw_data:
